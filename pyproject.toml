[project]
name = "vera-workspace"
version = "0.2.3"
description = "VERA mono-repo workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-doc",
  "vera-ingest",
  "vera-cli",
  "vera-app",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "vera-mcp"]
ml = ["sentence-transformers>=2.7"]
app = ["vera-app"]
mcp = ["vera-mcp"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-redirects>=1.2",
]
# Build-only: PyInstaller for packages/vera-app `build:sidecar`.
sidecar = ["pyinstaller>=6"]

[tool.uv.workspace]
members = [
  "packages/vera-doc",
  "packages/vera-ingest",
  "packages/vera-mcp",
  "packages/vera-cli",
  "packages/vera-app",
]

[tool.uv.sources]
vera-doc = { workspace = true }
vera-ingest = { workspace = true }
vera-mcp = { workspace = true }
vera-cli = { workspace = true }
vera-app = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
pythonpath = [
  "packages/vera-doc/src",
  "packages/vera-ingest/src",
  "packages/vera-mcp/src",
  "packages/vera-cli/src",
  "packages/vera-app/src",
]
testpaths = ["tests"]
addopts = "-q"
