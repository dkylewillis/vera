[project]
name = "vera-workspace"
version = "0.3.0"
description = "VERA mono-repo workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-doc",
  "vera-ingest",
  "vera-ingest-pymupdf",
  "vera-cli",
  "vera-app",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "reportlab>=4",
  "vera-mcp",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4",
]
ml = ["sentence-transformers>=2.7"]
app = ["vera-app"]
mcp = ["vera-mcp"]
docling = ["vera-ingest-docling"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-redirects>=1.2",
]
# Build-only: PyInstaller for packages/vera-app `build:sidecar`.
sidecar = ["pyinstaller>=6"]

[tool.uv.workspace]
members = [
  "packages/vera-doc",
  "packages/vera-ingest",
  "packages/vera-ingest-pymupdf",
  "packages/vera-ingest-docling",
  "packages/vera-mcp",
  "packages/vera-cli",
  "packages/vera-app",
]

[tool.uv.sources]
vera-doc = { workspace = true }
vera-ingest = { workspace = true }
vera-ingest-pymupdf = { workspace = true }
vera-ingest-docling = { workspace = true }
vera-mcp = { workspace = true }
vera-cli = { workspace = true }
vera-app = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages", "tests", "benchmarks"]
extend-exclude = ["packages/vera-app/src/renderer", "packages/vera-app/electron"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",
  "B905",
  "E402",
  "E741",
]

[tool.ruff.lint.isort]
known-first-party = [
  "vera_doc",
  "vera_ingest",
  "vera_ingest_pymupdf",
  "vera_ingest_docling",
  "vera_cli",
  "vera_mcp",
  "vera_app",
]

[tool.mypy]
python_version = "3.10"
files = ["packages/vera-doc/src"]
mypy_path = "packages/vera-doc/src"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
pythonpath = [
  "packages/vera-doc/src",
  "packages/vera-ingest/src",
  "packages/vera-ingest-pymupdf/src",
  "packages/vera-ingest-docling/src",
  "packages/vera-mcp/src",
  "packages/vera-cli/src",
  "packages/vera-app/src",
]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "docling: offline Docling ingest pipeline tests (requires vera-ingest-docling)",
  "docling_integration: optional live Docling conversion with local models",
]
