[project]
name = "vera-lab"
version = "0.3.0"
description = "Contributor tool for visualizing ingest pipeline layout and chunks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-ingest>=0.3.0",
  "pymupdf>=1.23",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["vera", "ingest", "layout", "debug", "lab"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/dkylewillis/vera"
Repository = "https://github.com/dkylewillis/vera"
Documentation = "https://dkylewillis.github.io/vera/packages/vera-lab/"

[project.scripts]
vera-lab = "vera_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/vera_lab/assets" = "vera_lab/assets"
