[project]
name = "vera-extract"
version = "0.2.0"
description = "Source extraction and chunking adapters for VERA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-doc",
  "pdfplumber>=0.11",
  "pymupdf>=1.23",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["pdf", "ocr", "chunking", "semantic-search", "vera"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_extract"]
