[project]
name = "vera-ingest-pymupdf"
version = "0.3.0"
description = "Default PyMuPDF PDF ingest pipeline for VERA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-ingest>=0.3.0",
  "pymupdf>=1.23",
  "pdfplumber>=0.11",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["pymupdf", "pdf", "ocr", "chunking", "semantic-search", "vera"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/dkylewillis/vera"
Repository = "https://github.com/dkylewillis/vera"
Documentation = "https://dkylewillis.github.io/vera/packages/vera-ingest-pymupdf/"

[project.entry-points."vera.ingest_pipelines"]
pymupdf = "vera_ingest_pymupdf:create_pipeline"

[project.entry-points."vera.ingest_pipeline_descriptors"]
pymupdf = "vera_ingest_pymupdf:create_descriptor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_ingest_pymupdf"]
