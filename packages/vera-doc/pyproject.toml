[project]
name = "vera-doc"
version = "0.3.0"
description = "Embedded storage and search engine for portable .vera archives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["semantic-search", "vector-database", "sqlite", "embeddings", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/dkylewillis/vera"
Repository = "https://github.com/dkylewillis/vera"
Documentation = "https://dkylewillis.github.io/vera/packages/vera-doc/"
Specification = "https://github.com/dkylewillis/vera/blob/main/docs/vera-spec-v0.2.md"

[project.optional-dependencies]
ml = ["sentence-transformers>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera"]
