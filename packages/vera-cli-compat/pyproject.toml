[project]
name = "vera-cli"
version = "0.3.1"
description = "Compatibility alias for the vera CLI; install `vera` instead"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera>=0.3.1",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["semantic-search", "document", "sqlite", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/dkylewillis/vera"
Repository = "https://github.com/dkylewillis/vera"
Documentation = "https://dkylewillis.github.io/vera/packages/vera-cli/"

[project.optional-dependencies]
mcp = ["vera[mcp]>=0.3.1"]
docling = ["vera[docling]>=0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
