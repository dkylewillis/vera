[project]
name = "vera-ingest-ooxml"
version = "0.3.2"
description = "Lightweight Word, PowerPoint, and Excel ingest pipeline for VERA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-ingest>=0.3.2",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["docx", "pptx", "xlsx", "ooxml", "chunking", "semantic-search", "vera"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/dkylewillis/vera"
Repository = "https://github.com/dkylewillis/vera"
Documentation = "https://dkylewillis.github.io/vera/packages/vera-ingest-ooxml/"

[project.entry-points."vera.ingest_pipelines"]
ooxml = "vera_ingest_ooxml:create_pipeline"

[project.entry-points."vera.ingest_pipeline_descriptors"]
ooxml = "vera_ingest_ooxml:create_descriptor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_ingest_ooxml"]
