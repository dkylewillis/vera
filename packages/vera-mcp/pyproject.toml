[project]
name = "vera-mcp"
version = "0.2.0"
description = "Model Context Protocol integration for VERA databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-doc",
  "mcp>=1.0",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["mcp", "semantic-search", "vera"]

[project.scripts]
vera-mcp = "vera_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_mcp"]
