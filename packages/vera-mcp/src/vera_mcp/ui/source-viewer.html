<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VERA Sources</title>
<style>
:root{color-scheme:light dark;--bg-app:light-dark(#f5f6f8,#181818);--bg-activity:light-dark(#1f2430,#181818);--bg-side:light-dark(#f0f2f5,#181818);--bg-surface:light-dark(#fff,#181818);--bg-surface-2:light-dark(#f3f5f8,#202020);--bg-surface-3:light-dark(#eaeef3,#292929);--bg-chat:light-dark(#fff,#161616);--text-strong:light-dark(#0f172a,#e8e8e8);--text:light-dark(#1f2937,#ccc);--text-muted:light-dark(#64748b,#9d9d9d);--text-faint:light-dark(#94a3b8,#6e6e6e);--border:light-dark(#dfe3ea,#2b2b2b);--border-strong:light-dark(#c9d0db,#3a3a3a);--border-faint:light-dark(#e7eaf0,#242424);--accent:#2563eb;--accent-hover:#1d4ed8;--accent-soft:light-dark(#e8f0fe,#1b2840);--accent-soft-border:light-dark(#c4dafd,#2a3f63);--accent-text:light-dark(#1a56db,#6ea0f7);--good:#0e9f6e;--good-soft:light-dark(#def7ec,#10261d);--radius-sm:4px;--radius:6px;--radius-lg:10px;--shadow-sm:light-dark(0 1px 2px rgba(15,23,42,.06),0 1px 2px rgba(0,0,0,.4));--shadow:light-dark(0 6px 18px rgba(15,23,42,.08),0 8px 22px rgba(0,0,0,.45));font-family:Inter,"Segoe UI",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg-chat);color:var(--text);font:14px/1.55 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);padding:6px 11px}button:hover{border-color:var(--border-strong);background:var(--bg-surface-2)}button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
header{height:58px;display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--border);background:var(--bg-surface)}.veraIcon{width:27px;height:27px;color:var(--accent);flex:none}.brand{font-size:13px;font-weight:750;letter-spacing:.11em;color:var(--text-strong)}.subtitle{color:var(--text-muted);font-size:11px}.grow{flex:1}.launcherPanel{padding:18px}.launcherCard{display:flex;align-items:center;gap:13px;max-width:620px;margin:0 auto;padding:15px 16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-surface);box-shadow:var(--shadow-sm)}.launcherMark{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius);color:#f7f4ed;background:#282a2f;box-shadow:var(--shadow-sm)}.launcherMark svg{width:27px;height:27px}.launcherCopy{min-width:0;flex:1}.launcherCopy strong{display:block;color:var(--text-strong)}.launcherCopy small{display:block;margin-top:2px;color:var(--text-muted)}.openViewer{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:650}.openViewer:hover{color:#fff;background:var(--accent-hover);border-color:var(--accent-hover)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);height:540px}.sources{overflow:auto;background:var(--bg-side);padding:12px;border-right:1px solid var(--border)}.label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin:2px 4px 10px}.source{display:block;text-align:left;width:100%;margin-bottom:8px;padding:10px;overflow-wrap:anywhere;box-shadow:var(--shadow-sm)}.source[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.sourceId{display:inline-block;margin-right:6px;color:var(--good);font-size:11px;font-weight:750}.source strong{font-size:12px;color:var(--text-strong)}.source small{display:block;color:var(--text-muted);margin:4px 0}.excerpt{font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reader{min-width:0;display:flex;flex-direction:column;background:var(--bg-chat)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border)}.location{font-size:12px;color:var(--text-muted)}.notice{padding:7px 12px;font-size:12px;color:var(--text-muted);background:var(--bg-surface-2)}.viewport{overflow:auto;flex:1;background:#2b2b2d;padding:20px;position:relative}.paper{position:relative;max-width:none;margin:0 auto;box-shadow:0 3px 16px #0005;background:#fff}.paper img{display:block;width:100%;height:auto}.box{position:absolute;background:rgba(37,99,235,.16);border:2px solid var(--accent);pointer-events:none}.no-highlights .box{display:none}.lines{margin:0;padding:16px 0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 ui-monospace,monospace;background:var(--bg-surface);color:var(--text)}.textline{display:flex;padding:0 12px}.number{min-width:45px;color:var(--text-muted);user-select:none}.active{background:color-mix(in srgb,var(--accent) 22%,transparent)}.no-highlights .active{background:none}.passage{white-space:pre-wrap;margin:0;background:var(--bg-surface);padding:20px;color:var(--text)}.empty{padding:40px 18px;color:var(--text-muted);background:var(--bg-surface);min-height:100%}details{border-top:1px solid var(--border);padding:7px 12px;font-size:12px;background:var(--bg-surface)}details p{max-height:100px;overflow:auto;white-space:pre-wrap}summary{cursor:pointer;color:var(--accent-text)}body.fullscreen .layout{height:calc(100vh - 58px)}
@media(max-width:620px){.launcherPanel{padding:10px}.launcherCard{align-items:flex-start;flex-wrap:wrap}.openViewer{width:100%}.layout{grid-template-columns:1fr;height:auto}.sources{display:flex;gap:8px;overflow:auto;max-height:145px;border-right:0;border-bottom:1px solid var(--border)}.sources .label{display:none}.source{min-width:205px;max-width:230px;margin:0}.reader{height:470px}.viewport{padding:10px}body.fullscreen .layout{height:auto}body.fullscreen .reader{height:calc(100vh - 203px)}header{padding:8px 11px}}
</style>
</head>
<body>
<header>
<svg class="veraIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><mask id="vera-mask"><rect width="24" height="24" fill="white"/><path d="M7.25 9.25H9.55L12 15.15L14.45 9.25H16.75L13.15 17.5C12.95 17.96 12.51 18.25 12 18.25C11.49 18.25 11.05 17.96 10.85 17.5L7.25 9.25Z" fill="black"/><path d="M14 2V7.25C14 7.664 14.336 8 14.75 8H20" stroke="black" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><path mask="url(#vera-mask)" fill="currentColor" d="M6 2H14L20 8V20C20 21.105 19.105 22 18 22H6C4.895 22 4 21.105 4 20V4C4 2.895 4.895 2 6 2Z"/></svg>
<div><div class="brand">VERA</div><div class="subtitle" id="subtitle">Sources · Read the evidence in context</div></div><span class="grow"></span><button id="back" hidden>Close viewer</button><button id="expand" hidden>Expand</button>
</header>
<main class="launcherPanel" id="launcherPanel" hidden><div class="launcherCard"><div class="launcherMark" aria-label="VERA"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><mask id="vera-launcher-mask"><rect width="24" height="24" fill="white"/><path d="M7.25 9.25H9.55L12 15.15L14.45 9.25H16.75L13.15 17.5C12.95 17.96 12.51 18.25 12 18.25C11.49 18.25 11.05 17.96 10.85 17.5L7.25 9.25Z" fill="black"/><path d="M14 2V7.25C14 7.664 14.336 8 14.75 8H20" stroke="black" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><path mask="url(#vera-launcher-mask)" fill="currentColor" d="M6 2H14L20 8V20C20 21.105 19.105 22 18 22H6C4.895 22 4 21.105 4 20V4C4 2.895 4.895 2 6 2Z"/></svg></div><div class="launcherCopy"><strong>Supporting sources</strong><small id="launcherSummary">Open the VERA viewer to inspect highlighted passages.</small></div><button class="openViewer" id="openViewer">Open VERA sources</button></div></main>
<div class="viewerStage" id="viewerStage" hidden><div class="layout">
<nav class="sources" id="sources" aria-label="Retrieved sources"><div class="label">Supporting passages</div></nav>
<section class="reader" aria-label="Source document">
<div class="toolbar"><button id="prev" aria-label="Previous page" disabled>←</button><span class="location" id="location">Source preview</span><button id="next" aria-label="Next page" disabled>→</button><span class="grow"></span><button id="highlight" aria-pressed="true">Highlights on</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button></div>
<div id="notice" class="notice" role="status">Connecting to the source viewer…</div><div class="viewport" id="viewport"><div class="empty">Select a retrieved source to inspect its original passage.</div></div>
<details id="details" hidden><summary>Retrieved passage</summary><p id="passage"></p></details>
</section></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);let cards=[],selected=null,current=null,serial=0,zoom=1,ready=false,hostContext={},viewMode="sources",viewerOpen=true;const pending=new Map();let nextId=1;
function send(message){window.parent.postMessage({jsonrpc:"2.0",...message},"*")}
function request(method,params){return new Promise((resolve,reject)=>{const id=nextId++;const timer=setTimeout(()=>{pending.delete(id);reject(new Error("The host did not respond. Try opening this source again."))},20000);pending.set(id,{resolve,reject,timer});send({id,method,params})})}
function note(message){$("notice").textContent=message;$("notice").hidden=!message}
function elem(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(className)e.className=className;return e}
function citation(card){return[card.page_start?"p. "+card.page_start+(card.page_end&&card.page_end!==card.page_start?"–"+card.page_end:""):"",card.heading_path].filter(Boolean).join(" · ")||"Stored passage"}
function context(value){hostContext={...hostContext,...value};if(value.theme==="dark"||value.theme==="light")document.documentElement.style.colorScheme=value.theme;const mode=hostContext.displayMode||"inline";document.body.classList.toggle("fullscreen",mode==="fullscreen");$("expand").hidden=!viewerOpen||!(hostContext.availableDisplayModes||[]).includes("fullscreen");$("expand").textContent=mode==="fullscreen"?"Collapse":"Expand"}
function drawCards(){$("sources").replaceChildren(elem("div","Supporting passages","label"));cards.forEach((card,i)=>{const b=elem("button",undefined,"source");b.setAttribute("aria-pressed",String(selected===i));const title=elem("div");if(card.id)title.append(elem("span","["+card.id+"]","sourceId"));title.append(elem("strong",card.source_filename||String(card.file||"Archive").split(/[\\/]/).pop()));b.append(title,elem("small",citation(card)),elem("span",card.error||card.text||"","excerpt"));b.onclick=()=>select(i);$("sources").append(b)})}
function showLauncher(){viewerOpen=false;$("launcherPanel").hidden=false;$("viewerStage").hidden=true;$("back").hidden=true;$("subtitle").textContent="Sources · "+cards.length+" supporting passage"+(cards.length===1?"":"s");$("launcherSummary").textContent=cards.length+" citation"+(cards.length===1?"":"s")+" ready. Open the viewer, then select a citation.";context({})}
function showViewer(){viewerOpen=true;$("launcherPanel").hidden=true;$("viewerStage").hidden=false;$("back").hidden=viewMode!=="launcher";$("subtitle").textContent="Sources · Read the evidence in context";context({})}
function controls(){const p=current?.page||1,n=current?.page_count||1;$("prev").disabled=!ready||p<=1;$("next").disabled=!ready||p>=n;$("zoomOut").disabled=current?.kind!=="pdf"||zoom<=.6;$("zoomIn").disabled=current?.kind!=="pdf"||zoom>=2}
function drawView(view){current=view;const viewport=$("viewport");viewport.replaceChildren();viewport.scrollTop=0;if(!view){note("Select a citation to inspect its source.");controls();return}note(view.notice||"");$("location").textContent=view.kind==="markdown"?"Lines "+view.line_start+"–"+(view.line_start+view.lines.length-1):view.page?"Page "+view.page+" of "+view.page_count:"Stored passage";$("details").hidden=!view.text;$("passage").textContent=view.text||"";if(view.kind==="pdf"&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(view.image||"")){const paper=elem("div",undefined,"paper");paper.style.width=zoom*100+"%";const img=elem("img");img.alt="Source page "+view.page;img.src=view.image;paper.append(img);for(const box of view.boxes||[]){if(box.length!==4||!box.every(Number.isFinite)||box.some(n=>n<0||n>1))continue;const overlay=elem("span",undefined,"box");Object.assign(overlay.style,{left:box[0]*100+"%",top:box[1]*100+"%",width:box[2]*100+"%",height:box[3]*100+"%"});paper.append(overlay)}viewport.append(paper)}else if(view.kind==="markdown"){const pre=elem("pre",undefined,"lines");view.lines.forEach((line,i)=>{const n=view.line_start+i,active=(view.spans||[]).some(([a,b])=>n>=a&&n<=b);const row=elem("span",undefined,"textline"+(active?" active":""));row.append(elem("span",n,"number"),elem("span",line||" "));pre.append(row)});viewport.append(pre);const active=pre.querySelector(".active");if(active)viewport.scrollTop=Math.max(0,active.offsetTop-viewport.offsetTop-80)}else viewport.append(elem("div",view.text||"No readable source available.","passage"));controls()}
function receive(result){if(result?.isError)throw new Error(result.content?.find(c=>c.type==="text")?.text||"Unable to open source.");const data=result?._meta?.["vera/view"];if(!data)throw new Error("The host did not deliver source-view metadata. The retrieved text is still available in chat.");return data}
function initial(result){serial++;const data=receive(result);cards=data.sources||[];selected=data.selected;viewMode=data.mode==="launcher"?"launcher":"sources";zoom=1;drawCards();drawView(data.view);if(viewMode==="launcher")showLauncher();else showViewer()}
async function select(index,page=0){selected=index;drawCards();const card=cards[index],ticket=++serial;if(card?.error){drawView({kind:"text",text:"",notice:card.error});return}if(!ready){note("Source navigation is unavailable until the host connects.");return}current=null;controls();$("viewport").replaceChildren(elem("div","Loading source…","empty"));note("");try{const result=await request("tools/call",{name:"vera_source_page",arguments:{file:card.file,chunk_id:card.chunk_id,page}});if(ticket!==serial)return;drawView(receive(result))}catch(error){if(ticket===serial)drawView({kind:"text",text:card.text,notice:error.message})}}
async function requestMode(mode){if(!(hostContext.availableDisplayModes||[]).includes(mode))return;try{const result=await request("ui/request-display-mode",{mode});context({displayMode:result.mode})}catch(error){note(error.message)}}
async function openViewer(){showViewer();if(hostContext.displayMode!=="fullscreen")await requestMode("fullscreen")}
$("prev").onclick=()=>select(selected,current.page-1);$("next").onclick=()=>select(selected,current.page+1);$("highlight").onclick=()=>{const off=$("viewport").classList.toggle("no-highlights");$("highlight").setAttribute("aria-pressed",String(!off));$("highlight").textContent=off?"Highlights off":"Highlights on"};$("zoomOut").onclick=()=>{zoom=Math.max(.6,zoom-.2);drawView(current)};$("zoomIn").onclick=()=>{zoom=Math.min(2,zoom+.2);drawView(current)};$("expand").onclick=()=>requestMode(hostContext.displayMode==="fullscreen"?"inline":"fullscreen");$("openViewer").onclick=openViewer;$("back").onclick=async()=>{if(hostContext.displayMode==="fullscreen")await requestMode("inline");showLauncher()};
window.addEventListener("message",event=>{if(event.source!==window.parent||!event.data||event.data.jsonrpc!=="2.0")return;const m=event.data;if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error(m.error.message||"Host request failed.")):p.resolve(m.result);return}if(m.method==="ui/notifications/tool-result"){try{initial(m.params)}catch(e){note(e.message)}}if(m.method==="ui/notifications/host-context-changed")context(m.params||{});if(m.method==="ping"&&m.id!==undefined)send({id:m.id,result:{}});if(m.method==="ui/resource-teardown"&&m.id!==undefined){serial++;send({id:m.id,result:{}})}});
if(window.parent!==window){request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"VERA sources",version:"0.3.0"},appCapabilities:{availableDisplayModes:["inline","fullscreen"]}}).then(result=>{context(result.hostContext||{});ready=!!result.hostCapabilities?.serverTools;send({method:"ui/notifications/initialized",params:{}});controls();note("Waiting for VERA sources…")}).catch(error=>note(error.message))}else note("Open this viewer through a VERA source result in an MCP Apps host.");
</script>
</body></html>
