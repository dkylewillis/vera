<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERA Sources</title>
<style>
/* VERA surfaces: #1f2430, #def7ec */
:root{color-scheme:light dark;--bg:light-dark(#fff,#181818);--side:light-dark(#f0f2f5,#181818);--surface:light-dark(#f3f5f8,#202020);--text:light-dark(#1f2937,#ccc);--strong:light-dark(#0f172a,#e8e8e8);--muted:light-dark(#64748b,#9d9d9d);--border:light-dark(#dfe3ea,#2b2b2b);--accent:#2563eb;--good:#0e9f6e;font-family:Inter,"Segoe UI",ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:6px 11px}button:hover{background:var(--surface)}button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}header{height:58px;display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--border)}.veraIcon{width:27px;height:27px;color:var(--accent);flex:none}.brand{font-size:13px;font-weight:750;letter-spacing:.11em;color:var(--strong)}.subtitle{color:var(--muted);font-size:11px}.grow{flex:1}.launcher{padding:18px}.launcherCard{display:flex;align-items:center;gap:13px;max-width:620px;margin:auto;padding:15px 16px;border:1px solid var(--border);border-radius:10px}.launcherMark{display:grid;place-items:center;width:36px;height:36px;border-radius:6px;color:#f7f4ed;background:#282a2f}.launcherMark svg{width:27px}.launcherCopy{min-width:0;flex:1}.launcherCopy strong{display:block;color:var(--strong)}.launcherCopy small{display:block;margin-top:2px;color:var(--muted)}.primary{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:650}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);height:540px}.sources{overflow:auto;background:var(--side);padding:12px;border-right:1px solid var(--border)}.label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:2px 4px 10px}.source{display:block;text-align:left;width:100%;margin-bottom:8px;padding:10px;overflow-wrap:anywhere}.source[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.sourceId{display:inline-block;margin-right:6px;color:var(--good);font-size:11px;font-weight:750}.source strong{font-size:12px;color:var(--strong)}.source small{display:block;color:var(--muted);margin:4px 0}.excerpt{font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.reader{min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border)}.location{font-size:12px;color:var(--muted)}.notice{padding:7px 12px;font-size:12px;color:var(--muted);background:var(--surface)}.viewport{overflow:auto;flex:1;background:#2b2b2d;padding:20px;position:relative}.pdfStack{display:grid;gap:18px;max-width:1200px;margin:auto}.pdfPage{min-height:180px;display:grid;place-items:center;scroll-margin-top:16px;color:#bac1cc}.pdfPageLoading{width:100%;min-height:180px;display:grid;place-items:center;background:#202124;border:1px solid #3a3a3c;border-radius:6px}.paper{position:relative;max-width:none;margin:auto;box-shadow:0 3px 16px #0005;background:#fff}.paper img{display:block;width:100%;height:auto}.box{position:absolute;background:rgba(37,99,235,.16);border:2px solid var(--accent);pointer-events:none}.no-highlights .box{display:none}.lines,.passage{margin:0;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);color:var(--text)}.lines{font:13px/1.8 ui-monospace,monospace}.textline{display:flex}.number{min-width:45px;color:var(--muted);user-select:none}.active{background:color-mix(in srgb,var(--accent) 22%,transparent)}.no-highlights .active{background:none}.empty{padding:40px 18px;color:var(--muted);background:var(--bg);min-height:100%}details{border-top:1px solid var(--border);padding:7px 12px;font-size:12px}details p{max-height:100px;overflow:auto}summary{cursor:pointer;color:var(--accent)}body.fullscreen .layout{height:calc(100vh - 58px)}@media(max-width:620px){.launcher{padding:10px}.launcherCard{align-items:flex-start;flex-wrap:wrap}.primary{width:100%}.layout{grid-template-columns:1fr;height:auto}.sources{display:flex;gap:8px;overflow:auto;max-height:145px;border-right:0;border-bottom:1px solid var(--border)}.sources .label{display:none}.source{min-width:205px;max-width:230px;margin:0}.reader{height:470px}.viewport{padding:10px}body.fullscreen .layout{height:auto}body.fullscreen .reader{height:calc(100vh - 203px)}header{padding:8px 11px}}
</style><style>.reader,.viewport{min-height:0}</style></head><body>
<header><svg class="veraIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><mask id="vera-mask"><rect width="24" height="24" fill="white"/><path d="M7.25 9.25H9.55L12 15.15L14.45 9.25H16.75L13.15 17.5C12.95 17.96 12.51 18.25 12 18.25C11.49 18.25 11.05 17.96 10.85 17.5L7.25 9.25Z" fill="black"/></mask></defs><path mask="url(#vera-mask)" fill="currentColor" d="M6 2H14L20 8V20C20 21.105 19.105 22 18 22H6C4.895 22 4 21.105 4 20V4C4 2.895 4.895 2 6 2Z"/></svg><div><div class="brand">VERA</div><div class="subtitle" id="subtitle">Sources · Read the evidence in context</div></div><span class="grow"></span><button id="back" hidden>Close viewer</button><button id="expand" hidden>Expand</button></header>
<main class="launcher" id="launcher" hidden><div class="launcherCard"><div class="launcherMark"><svg viewBox="0 0 24 24" fill="none"><path fill="currentColor" d="M6 2H14L20 8V20C20 21.105 19.105 22 18 22H6C4.895 22 4 21.105 4 20V4C4 2.895 4.895 2 6 2Z"/></svg></div><div class="launcherCopy"><strong>Supporting sources</strong><small id="launcherSummary"></small></div><button class="primary" id="openViewer">Open VERA sources</button></div></main>
<div id="viewer" hidden><div class="layout"><nav class="sources" id="sources" aria-label="Retrieved sources"></nav><section class="reader" aria-label="Source document"><div class="toolbar"><button id="prev" aria-label="Previous page" disabled>←</button><span class="location" id="location">Source preview</span><button id="next" aria-label="Next page" disabled>→</button><span class="grow"></span><button id="highlight" aria-pressed="true">Highlights on</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button></div><div id="notice" class="notice" role="status"></div><div class="viewport" id="viewport"><div class="empty">Select a retrieved source to inspect its original passage.</div></div><details id="details" hidden><summary>Retrieved passage</summary><p id="passage"></p></details></section></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id),pending=new Map();let nextId=1,cards=[],selected=null,current=null,zoom=1,ready=false,hostContext={},viewMode="sources",viewerOpen=true,pdfState=null;
function send(message){window.parent.postMessage({jsonrpc:"2.0",...message},"*")}
function request(method,params){return new Promise((resolve,reject)=>{const id=nextId++,timer=setTimeout(()=>{pending.delete(id);reject(new Error("The host did not respond. Try opening this source again."))},20000);pending.set(id,{resolve,reject,timer});send({id,method,params})})}
function note(message){$("notice").textContent=message;$("notice").hidden=!message}function elem(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(className)e.className=className;return e}function receive(result){if(result?.isError)throw new Error(result.content?.find(c=>c.type==="text")?.text||"Unable to open source.");const data=result?._meta?.["vera/view"];if(!data)throw new Error("The host did not deliver source-view metadata.");return data}function citation(card){return[card.page_start?"p. "+card.page_start+(card.page_end&&card.page_end!==card.page_start?"–"+card.page_end:""):"",card.heading_path].filter(Boolean).join(" · ")||"Stored passage"}
function context(value){hostContext={...hostContext,...value};if(value.theme==="dark"||value.theme==="light")document.documentElement.style.colorScheme=value.theme;const mode=hostContext.displayMode||"inline";document.body.classList.toggle("fullscreen",mode==="fullscreen");$("expand").hidden=!viewerOpen||!(hostContext.availableDisplayModes||[]).includes("fullscreen");$("expand").textContent=mode==="fullscreen"?"Collapse":"Expand"}
function drawCards(){$("sources").replaceChildren(elem("div","Supporting passages","label"));cards.forEach((card,i)=>{const b=elem("button",undefined,"source"),title=elem("div");b.setAttribute("aria-pressed",String(selected===i));if(card.id)title.append(elem("span","["+card.id+"]","sourceId"));title.append(elem("strong",card.source_filename||String(card.file||"Archive").split(/[\\/]/).pop()));b.append(title,elem("small",citation(card)),elem("span",card.error||card.text||"","excerpt"));b.onclick=()=>select(i);$("sources").append(b)})}
function showLauncher(){viewerOpen=false;$("launcher").hidden=false;$("viewer").hidden=true;$("back").hidden=true;$("subtitle").textContent="Sources · "+cards.length+" supporting passage"+(cards.length===1?"":"s");$("launcherSummary").textContent=cards.length+" citation"+(cards.length===1?"":"s")+" ready. Open the viewer, then select a citation.";context({})}function showViewer(){viewerOpen=true;$("launcher").hidden=true;$("viewer").hidden=false;$("back").hidden=viewMode!=="launcher";$("subtitle").textContent="Sources · Read the evidence in context";context({})}
function controls(){const p=current?.page||1,n=current?.page_count||1;$("prev").disabled=!ready||current?.kind!=="pdf"||p<=1;$("next").disabled=!ready||current?.kind!=="pdf"||p>=n;$("zoomOut").disabled=current?.kind!=="pdf"||zoom<=.6;$("zoomIn").disabled=current?.kind!=="pdf"||zoom>=2}function updateLocation(){if(!current)return;$("location").textContent=current.kind==="markdown"?"Lines "+current.line_start+"–"+(current.line_start+current.lines.length-1):current.page?"Page "+current.page+" of "+current.page_count:"Stored passage";controls()}
function renderPdfPage(view){const state=pdfState;if(!state||view.kind!=="pdf")return;state.pages.set(view.page,view);const slot=$("viewport").querySelector(`.pdfPage[data-page="${view.page}"]`);if(!slot)return;const paper=elem("div",undefined,"paper"),image=elem("img");paper.style.width=(zoom*100)+"%";image.alt="Source page "+view.page;image.src=view.image;paper.append(image);for(const box of view.boxes||[]){if(box.length!==4||!box.every(Number.isFinite)||box.some(n=>n<0||n>1))continue;const overlay=elem("span",undefined,"box");Object.assign(overlay.style,{left:box[0]*100+"%",top:box[1]*100+"%",width:box[2]*100+"%",height:box[3]*100+"%"});paper.append(overlay)}slot.replaceChildren(paper)}
function loadPdfPage(page){const state=pdfState;if(!state||page<1||page>state.pageCount||state.pages.has(page)||state.loading.has(page))return;state.loading.add(page);request("tools/call",{name:"vera_source_page",arguments:{file:state.card.file,chunk_id:state.card.chunk_id,page}}).then(result=>{const view=receive(result);if(pdfState===state&&view.kind==="pdf")renderPdfPage(view);state.loading.delete(page)}).catch(error=>{state.loading.delete(page);if(pdfState===state){const slot=$("viewport").querySelector(`.pdfPage[data-page="${page}"]`);if(slot)slot.replaceChildren(elem("div",error.message,"pdfPageLoading"))}})}
function loadVisiblePages(){const state=pdfState;if(!state)return;const viewport=$("viewport"),bounds=viewport.getBoundingClientRect();let closest;for(const slot of viewport.querySelectorAll(".pdfPage")){const page=Number(slot.dataset.page),rect=slot.getBoundingClientRect();if(rect.bottom>bounds.top-bounds.height&&rect.top<bounds.bottom+bounds.height)loadPdfPage(page);const distance=Math.abs(rect.top-bounds.top);if(!closest||distance<closest.distance)closest={page,distance}}if(closest&&current?.kind==="pdf"&&current.page!==closest.page){current={...current,page:closest.page};updateLocation()}}
function scrollToPdfPage(page){if(!pdfState)return;loadPdfPage(page);const viewport=$("viewport"),slot=viewport.querySelector(`.pdfPage[data-page="${page}"]`);if(slot)viewport.scrollTop=Math.max(0,slot.offsetTop-16);current={...current,page};updateLocation()}
function drawPdf(view,viewport){const card=cards[selected],stack=elem("div",undefined,"pdfStack");pdfState={card,pageCount:view.page_count,pages:new Map(),loading:new Set()};for(let page=1;page<=view.page_count;page++){const slot=elem("section",undefined,"pdfPage");slot.dataset.page=String(page);slot.append(elem("div","Loading page "+page+"…","pdfPageLoading"));stack.append(slot)}viewport.append(stack);renderPdfPage(view);loadPdfPage(Math.max(1,view.page-1));loadPdfPage(Math.min(view.page_count,view.page+1));requestAnimationFrame(()=>scrollToPdfPage(view.page))}
function drawView(view){current=view;pdfState=null;const viewport=$("viewport");viewport.replaceChildren();viewport.scrollTop=0;if(!view){note("Select a citation to inspect its source.");controls();return}note(view.notice||"");$("details").hidden=!view.text;$("passage").textContent=view.text||"";if(view.kind==="pdf"&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(view.image||""))drawPdf(view,viewport);else if(view.kind==="markdown"){const pre=elem("pre",undefined,"lines");view.lines.forEach((line,i)=>{const n=view.line_start+i,active=(view.spans||[]).some(([a,b])=>n>=a&&n<=b),row=elem("span",undefined,"textline"+(active?" active":""));row.append(elem("span",n,"number"),elem("span",line||" "));pre.append(row)});viewport.append(pre);const active=pre.querySelector(".active");if(active)viewport.scrollTop=Math.max(0,active.offsetTop-viewport.offsetTop-80)}else viewport.append(elem("div",view.text||"No readable source available.","passage"));updateLocation()}
function initial(result){const data=receive(result);cards=data.sources||[];selected=data.selected;viewMode=data.mode==="launcher"?"launcher":"sources";zoom=1;drawCards();drawView(data.view);if(viewMode==="launcher")showLauncher();else showViewer()}async function select(index,page=0){selected=index;drawCards();const card=cards[index];if(card?.error)return drawView({kind:"text",text:"",notice:card.error});if(!ready)return note("Source navigation is unavailable until the host connects.");pdfState=null;$("viewport").replaceChildren(elem("div","Loading source…","empty"));try{drawView(receive(await request("tools/call",{name:"vera_source_page",arguments:{file:card.file,chunk_id:card.chunk_id,page}})))}catch(error){drawView({kind:"text",text:card.text,notice:error.message})}}
async function requestMode(mode){if(!(hostContext.availableDisplayModes||[]).includes(mode))return;try{context({displayMode:(await request("ui/request-display-mode",{mode})).mode})}catch(error){note(error.message)}}
$("viewport").addEventListener("scroll",()=>requestAnimationFrame(loadVisiblePages));$("prev").onclick=()=>scrollToPdfPage(current.page-1);$("next").onclick=()=>scrollToPdfPage(current.page+1);$("highlight").onclick=()=>{const off=$("viewport").classList.toggle("no-highlights");$("highlight").setAttribute("aria-pressed",String(!off));$("highlight").textContent=off?"Highlights off":"Highlights on"};$("zoomOut").onclick=()=>{zoom=Math.max(.6,zoom-.2);document.querySelectorAll(".paper").forEach(p=>p.style.width=(zoom*100)+"%");loadVisiblePages()};$("zoomIn").onclick=()=>{zoom=Math.min(2,zoom+.2);document.querySelectorAll(".paper").forEach(p=>p.style.width=(zoom*100)+"%");loadVisiblePages()};$("expand").onclick=()=>requestMode(hostContext.displayMode==="fullscreen"?"inline":"fullscreen");$("openViewer").onclick=async()=>{showViewer();if(hostContext.displayMode!=="fullscreen")await requestMode("fullscreen")};$("back").onclick=async()=>{if(hostContext.displayMode==="fullscreen")await requestMode("inline");showLauncher()};
window.addEventListener("message",event=>{if(event.source!==window.parent||!event.data||event.data.jsonrpc!=="2.0")return;const m=event.data;if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error(m.error.message||"Host request failed.")):p.resolve(m.result);return}if(m.method==="ui/notifications/tool-result"){try{initial(m.params)}catch(e){note(e.message)}}if(m.method==="ui/notifications/host-context-changed")context(m.params||{});if(m.method==="ping"&&m.id!==undefined)send({id:m.id,result:{}});if(m.method==="ui/resource-teardown"&&m.id!==undefined){pdfState=null;send({id:m.id,result:{}})}});
if(window.parent!==window){request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"VERA sources",version:"0.3.0"},appCapabilities:{availableDisplayModes:["inline","fullscreen"]}}).then(result=>{context(result.hostContext||{});ready=!!result.hostCapabilities?.serverTools;send({method:"ui/notifications/initialized",params:{}});controls();note("Waiting for VERA sources…")}).catch(error=>note(error.message))}else note("Open this viewer through a VERA source result in an MCP Apps host.");
</script></body></html>
