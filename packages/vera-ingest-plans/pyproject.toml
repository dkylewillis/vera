[project]
name = "vera-ingest-plans"
version = "0.3.2"
description = "Construction drawing set ingest pipeline plugin for VERA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vera-ingest>=0.3.2",
  "vera-ingest-pymupdf>=0.3.2",
]
authors = [{name = "Kyle Willis"}]
license = {text = "Apache-2.0"}
keywords = ["pdf", "ocr", "construction", "drawings", "plans", "vera"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/dkylewillis/vera"
Repository = "https://github.com/dkylewillis/vera"

[project.entry-points."vera.ingest_pipelines"]
plans = "vera_ingest_plans:create_pipeline"

[project.entry-points."vera.ingest_pipeline_descriptors"]
plans = "vera_ingest_plans:create_descriptor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_ingest_plans"]
