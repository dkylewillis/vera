site_name: VERA
site_description: Vector-Embedded Retrieval Archive — portable document search and grounded retrieval
site_url: https://dkylewillis.github.io/vera/
repo_url: https://github.com/dkylewillis/vera
repo_name: dkylewillis/vera
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow

plugins:
  - search
  - redirects:
      redirect_maps:
        concepts/index.md: concepts/overview.md
        packages/vera-extract.md: packages/vera-ingest.md
        packages/vera-extract-examples.md: packages/vera-ingest-examples.md
        reference/vera-extract.md: reference/vera-ingest.md
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/vera-doc/src
            - packages/vera-ingest/src
            - packages/vera-ingest-pymupdf/src
            - packages/vera-ingest-docling/src
            - packages/vera-cli/src
            - packages/vera-mcp/src
            - packages/vera-app/src
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_section_style: list
            summary: true
            inherited_members: true
            show_source: false
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Packages:
      - Choose a package: packages/index.md
      - API reference overview: reference/index.md
  - vera-doc:
      - Overview: packages/vera-doc.md
      - Learn:
          - Getting started: guides/basic-usage.md
          - Concepts: concepts/overview.md
      - Guides:
          - Creating an embedding provider: creating-an-embedding-provider.md
          - Search: searching.md
          - Document libraries: document-libraries.md
          - Figures and regions: figures-and-regions.md
          - Validation and export: validation-and-export.md
          - Python API: python-api.md
      - Examples:
          - Create and search an archive: examples/basic-example.md
      - API reference:
          - Public package: reference/vera.md
          - Records: reference/vera-models.md
          - VeraDocument: reference/vera-document.md
          - VeraCorpus: reference/vera-corpus.md
          - Library index: reference/vera-collection.md
  - vera-ingest:
      - Overview and concepts: packages/vera-ingest.md
      - Guides:
          - Convert documents: conversion.md
          - Creating a pipeline plugin: creating-an-ingest-pipeline.md
      - Examples:
          - Python examples: packages/vera-ingest-examples.md
      - API reference:
          - Public package: reference/vera-ingest.md
  - vera-ingest-pymupdf:
      - Overview: packages/vera-ingest-pymupdf.md
  - vera-ingest-docling:
      - Overview: packages/vera-ingest-docling.md
  - vera-cli:
      - Overview: packages/vera-cli.md
      - Guides:
          - Getting started: getting-started.md
          - Recipes: examples.md
          - Evaluation: evaluation.md
      - Reference:
          - CLI commands: cli-reference.md
          - Python API: reference/vera-cli.md
  - vera-mcp:
      - Overview: packages/vera-mcp.md
      - Guides:
          - Setup, tools, and examples: mcp.md
          - Agent skills: agent-skills.md
      - API reference:
          - Public package: reference/vera-mcp.md
  - vera-app:
      - Overview and user guide: packages/vera-app.md
      - Guides:
          - Getting started: desktop-app-getting-started.md
      - Developer:
          - Architecture: desktop-app-architecture.md
  - Specifications:
      - Format specification (0.2): vera-spec-v0.2.md
      - Format specification (0.1): vera-spec-v0.1.md
      - Collection index design: collection-index.md
      - Library index structure: library-index-structure.md
  - Project:
      - Documentation index: user-documentation.md
      - Architecture: architecture.md
      - Troubleshooting: troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dkylewillis/vera
