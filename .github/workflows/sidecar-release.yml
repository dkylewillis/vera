name: Packaged sidecar release gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-sidecar:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/vera-app/package-lock.json

      - name: Sync sidecar build environment
        run: uv sync --extra app --extra sidecar --extra onnx

      - name: Export MiniLM ONNX graph
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/minilm-export-venv
        run: uv run --extra ml python packages/vera-app/scripts/export_minilm_onnx.py --dest packages/vera-app/build/minilm-export/all-MiniLM-L6-v2

      - name: Install app dependencies
        run: npm --prefix packages/vera-app install

      - name: Build frozen sidecar
        env:
          VERA_APP_PYTHON: ${{ github.workspace }}/.venv/Scripts/python.exe
        run: npm --prefix packages/vera-app run build:sidecar

      - name: Describe bundled ingest pipelines
        run: node packages/vera-app/scripts/verify-packaged-sidecar.cjs

      - name: Record sidecar size
        shell: pwsh
        run: |
          $sidecar = Get-Item packages/vera-app/build/sidecar/vera-sidecar
          $bytes = (Get-ChildItem $sidecar.FullName -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output ("unpacked_sidecar_bytes=" + $bytes)

      - name: Build renderer and Electron main process
        run: npm --prefix packages/vera-app run build

      - name: Write packaged Pro config
        env:
          VERA_PRO_SITE_URL: ${{ secrets.VERA_PRO_SITE_URL }}
          VERA_PRO_SUPABASE_URL: ${{ secrets.VERA_PRO_SUPABASE_URL }}
          VERA_PRO_SUPABASE_ANON_KEY: ${{ secrets.VERA_PRO_SUPABASE_ANON_KEY }}
        run: node packages/vera-app/scripts/write-pro-cloud.cjs

      - name: Build Windows NSIS installer
        working-directory: packages/vera-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: npx electron-builder --win nsis --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VERA.Setup
          path: packages/vera-app/release/VERA.Setup.*.exe
          if-no-files-found: error
