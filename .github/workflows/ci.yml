name: CI

on:
  push:
    branches: [main, v0.3]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --extra dev pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint and typecheck
        run: |
          uv sync --extra dev
          uv run ruff check packages tests benchmarks conftest.py
          uv run ruff format --check packages tests benchmarks conftest.py
          uv run mypy packages/vera-doc/src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Packaging errors otherwise surface for the first time in
      # publish-pypi.yml, which only runs once a release is already published.
      - name: Build every distribution
        run: uv build --all-packages --out-dir dist

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/vera-app/package-lock.json

      - name: Install app dependencies
        run: npm --prefix packages/vera-app install

      - name: Typecheck
        run: npm run app:typecheck

      - name: Unit tests
        run: npm --prefix packages/vera-app run test:unit

  docling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install optional Docling pipeline
        run: uv sync --extra dev --extra docling

      - name: Run Docling pipeline tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --extra dev --extra docling pytest -q -m "docling and not docling_integration"
